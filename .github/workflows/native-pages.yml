name: Native Kingdom Wars Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out static app
        uses: actions/checkout@v4

      - name: Verify native static site
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/js/app.js
          test -s web/js/solver-worker.js
          test -s web/js/rules.js
          test -s web/js/solvers.js
          test -s web/js/race.js
          test -s web/js/puzzles.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
