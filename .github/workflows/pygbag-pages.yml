name: Build and publish Kingdom Wars

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Pygbag browser package
        run: python -m pygbag --build main.py

      - name: Patch Pygbag BrowserFS CDN reference
        run: python scripts/prepare_web_build.py

      - name: Verify complete browser build
        run: |
          test -s build/web/index.html
          test -s build/web/aisc.project.apk
          test -s build/web/aisc.project.tar.gz
          test -s build/web/favicon.png
          grep -q 'aisc.project.apk' build/web/index.html
          grep -q 'aisc.project.tar.gz' build/web/index.html
          grep -q 'pythons.js' build/web/index.html
          grep -q 'browserfs@1.4.3' build/web/index.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
