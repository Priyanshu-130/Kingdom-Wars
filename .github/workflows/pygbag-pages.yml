name: Pygbag GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pygbag-pages
  cancel-in-progress: true

jobs:
  publish-existing-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing published build
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Verify the existing Pygbag build
        run: |
          test -s site/index.html
          test -s site/kingdom-wars.apk
          test -s site/kingdom-wars.tar.gz
          grep -q 'pythons.js' site/index.html

      - name: Publish build to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.6.9
        with:
          branch: gh-pages
          folder: site
